services:
  postgres:
    image: postgres:16-alpine
    container_name: netclear-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: netclear
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: netclear
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netclear -d netclear"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - netclear

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netclear-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://netclear:secret@postgres:5432/netclear
      PORT: "3001"
      NODE_ENV: production
      LEDGER_API_URL: http://host.docker.internal:6864
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - netclear

networks:
  netclear:
    driver: bridge

volumes:
  postgres_data:
