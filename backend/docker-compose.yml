services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: ${PORT:-3001}
    container_name: intrnet-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
